<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road Safety Education — Driver Training (Chunks 1 &amp; 2: Scenes 01A, 02A, 03A &amp; 04A)</title>
  <style>
    :root {
      --bg-page: #0a0d14;
      --bg-player: #111722;
      --bg-control: #161f2e;
      --bg-control-hover: #222f46;
      --border-color: #27354a;
      --border-highlight: #38bdf8;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --brand-blue: #2563eb;
      --brand-cyan: #06b6d4;
      --brand-green: #10b981;
      --brand-amber: #f59e0b;
      --brand-red: #ef4444;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    .video-card {
      width: 100%;
      max-width: 1360px;
      display: flex;
      flex-direction: column;
      background: var(--bg-player);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    /* Video Player Canvas Shell */
    .stage-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #090d14;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .stage-shell:fullscreen {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      background: #000000;
    }

    .stage-shell:fullscreen #video-stage {
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
    }

    #video-stage {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Controls Bar */
    .controls-wrapper {
      background: var(--bg-control);
      border-top: 1px solid var(--border-color);
      padding: 16px 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .scrubber-row {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      min-width: 48px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .time-readout.active {
      color: var(--brand-cyan);
    }

    .scrubber-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* Timeline Markers */
    .scene-jump-bar {
      position: absolute;
      top: -20px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .scene-jump-btn {
      pointer-events: auto;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .scene-jump-btn:hover {
      color: var(--brand-cyan);
    }

    input[type="range"].scrubber-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #2a384d;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
    }

    input[type="range"].scrubber-input:focus-visible {
      box-shadow: 0 0 0 2px var(--border-highlight);
    }

    input[type="range"].scrubber-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: grab;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    input[type="range"].scrubber-input::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: #7dd3fc;
    }

    input[type="range"].scrubber-input:active::-webkit-slider-thumb {
      cursor: grabbing;
      transform: scale(1.25);
    }

    input[type="range"].scrubber-input::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      cursor: grab;
    }

    /* Actions & Navigation */
    .actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .actions-left, .actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button.btn-ctrl {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-player);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    button.btn-ctrl.icon-btn {
      width: 40px;
      padding: 0;
    }

    button.btn-ctrl:hover {
      background: var(--bg-control-hover);
      border-color: #475569;
      color: #ffffff;
    }

    button.btn-ctrl:focus-visible {
      outline: 2px solid var(--border-highlight);
      outline-offset: 2px;
    }

    button.btn-ctrl svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    button.btn-ctrl[aria-pressed="true"] {
      background: #0d3852;
      border-color: var(--brand-cyan);
      color: #38bdf8;
    }

    .scene-pill {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      background: #1b2637;
      color: var(--text-sub);
      border: 1px solid #2e3e56;
      cursor: pointer;
      transition: all 0.15s;
    }

    .scene-pill:hover {
      background: #2b3b54;
      color: #f8fafc;
    }

    .scene-pill.active {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--brand-cyan);
      color: #38bdf8;
    }

    /* Shortcut Footer */
    .footer-bar {
      padding: 12px 22px;
      background: var(--bg-player);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 8px;
    }

    .keys-list {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .kbd-shortcut {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      font-family: monospace;
      font-size: 11px;
      font-weight: bold;
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      color: var(--brand-green);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand-green);
      box-shadow: 0 0 10px var(--brand-green);
    }

    @media (max-width: 900px) {
      body { padding: 8px; }
      .controls-wrapper { padding: 12px 14px; }
      .footer-bar { display: none; }
      .scene-jump-bar { display: none; }
      .scene-pill { font-size: 11px; padding: 4px 8px; }
    }
  </style>
</head>
<body>

  <main class="video-card" role="region" aria-label="Road Safety Driver Training Video">
    <!-- SVG 1920x1080 Full HD Canvas Stage -->
    <div class="stage-shell" id="stage-shell">
      <svg id="video-stage" viewBox="0 0 1920 1080" role="img" aria-labelledby="video-title video-desc">
        <title id="video-title">Road Safety Driver Training — Chunks 1 &amp; 2 (00:00–00:32)</title>
        <desc id="video-desc">Interactive 32-second road safety driver education covering Hazard Perception (01A), Keep-Left Rule (02A), Safe Overtaking (03A), and Intersections &amp; Right of Way (04A).</desc>

        <!-- Reusable SVG Design System Definitions -->
        <defs>
          <!-- Vehicle Shadows & Elevation Filters -->
          <filter id="filter-car-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
          </filter>

          <filter id="filter-card-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
          </filter>

          <filter id="filter-glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="filter-glow-amber" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="filter-sign-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
          </filter>

          <!-- Gradients -->
          <linearGradient id="grad-windshield" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.95"/>
            <stop offset="60%" stop-color="#0284c7" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
          </linearGradient>

          <radialGradient id="grad-headlight-beam" cx="50%" cy="100%" r="90%">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45"/>
            <stop offset="60%" stop-color="#fef08a" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="grad-card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#141c2b" stop-opacity="0.96"/>
            <stop offset="100%" stop-color="#0c121e" stop-opacity="0.98"/>
          </linearGradient>

          <linearGradient id="grad-driver-vision" cx="50%" cy="100%" r="100%">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
            <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
          </linearGradient>

          <!-- ========================================== -->
          <!-- SVG SYMBOLS DESIGN SYSTEM                  -->
          <!-- ========================================== -->

          <!-- 1. Detailed Top-Down Vehicle -->
          <symbol id="symbol-vehicle" viewBox="-65 -115 130 230">
            <!-- Shadow Base -->
            <rect x="-56" y="-106" width="112" height="212" rx="36" fill="#000000" opacity="0.35"/>
            <!-- 4 Wheels with tire treads -->
            <rect x="-63" y="-76" width="14" height="40" rx="4" fill="#0f172a"/>
            <rect x="49" y="-76" width="14" height="40" rx="4" fill="#0f172a"/>
            <rect x="-63" y="36" width="14" height="40" rx="4" fill="#0f172a"/>
            <rect x="49" y="36" width="14" height="40" rx="4" fill="#0f172a"/>
            <!-- Car Body Metallic Base -->
            <rect x="-54" y="-104" width="108" height="208" rx="34" fill="currentColor"/>
            <!-- Roof / Cabin Contour -->
            <rect x="-44" y="-56" width="88" height="116" rx="18" fill="#090d16" opacity="0.4"/>
            <!-- Front Windshield -->
            <path d="M-40 -50 Q0 -68 40 -50 L36 -12 Q0 -22 -36 -12 Z" fill="url(#grad-windshield)"/>
            <!-- Rear Windshield -->
            <path d="M-36 34 Q0 44 36 34 L38 58 Q0 72 -38 58 Z" fill="#0f172a" opacity="0.8"/>
            <!-- Side Mirrors -->
            <path d="M-54 -44 L-64 -38 L-64 -28 L-54 -32 Z" fill="currentColor"/>
            <path d="M54 -44 L64 -38 L64 -28 L54 -32 Z" fill="currentColor"/>
            <!-- Front Headlights (Warm White) -->
            <rect x="-42" y="-100" width="24" height="9" rx="4" fill="#fef08a"/>
            <rect x="18" y="-100" width="24" height="9" rx="4" fill="#fef08a"/>
            <!-- Rear Taillights (Standard Red) -->
            <rect x="-42" y="91" width="24" height="9" rx="4" fill="#ef4444"/>
            <rect x="18" y="91" width="24" height="9" rx="4" fill="#ef4444"/>
            <!-- Bonnet / Trunk Highlights -->
            <line x1="0" y1="-102" x2="0" y2="-72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
            <line x1="0" y1="64" x2="0" y2="98" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
          </symbol>

          <!-- 2. Detailed Heavy Commercial Truck/Bus -->
          <symbol id="symbol-truck" viewBox="-75 -160 150 320">
            <!-- Ground Shadow -->
            <rect x="-65" y="-150" width="130" height="300" rx="16" fill="#000000" opacity="0.4"/>
            <!-- Dual Rear & Front Wheels -->
            <rect x="-74" y="-120" width="16" height="48" rx="4" fill="#0f172a"/>
            <rect x="58" y="-120" width="16" height="48" rx="4" fill="#0f172a"/>
            <rect x="-74" y="60" width="16" height="48" rx="4" fill="#0f172a"/>
            <rect x="58" y="60" width="16" height="48" rx="4" fill="#0f172a"/>
            <rect x="-74" y="105" width="16" height="48" rx="4" fill="#0f172a"/>
            <rect x="58" y="105" width="16" height="48" rx="4" fill="#0f172a"/>
            <!-- Cargo Box / Container -->
            <rect x="-62" y="-50" width="124" height="195" rx="8" fill="#475569"/>
            <rect x="-56" y="-44" width="112" height="183" rx="4" fill="#334155"/>
            <!-- Cabin Front -->
            <rect x="-62" y="-150" width="124" height="95" rx="14" fill="#b45309"/>
            <!-- Truck Windshield -->
            <path d="M-52 -136 H52 L46 -95 H-46 Z" fill="url(#grad-windshield)"/>
            <!-- Mirrors -->
            <rect x="-72" y="-130" width="10" height="24" rx="2" fill="#1e293b"/>
            <rect x="62" y="-130" width="10" height="24" rx="2" fill="#1e293b"/>
            <!-- Amber Roof Warning Clearance Lights -->
            <circle cx="-42" cy="-145" r="4" fill="#fbbf24"/>
            <circle cx="0" cy="-145" r="4" fill="#fbbf24"/>
            <circle cx="42" cy="-145" r="4" fill="#fbbf24"/>
            <!-- Truck Taillights -->
            <rect x="-56" y="142" width="24" height="8" rx="2" fill="#ef4444"/>
            <rect x="32" y="142" width="24" height="8" rx="2" fill="#ef4444"/>
          </symbol>

          <!-- 3. Authentic Top-Down Bicycle & Cyclist -->
          <symbol id="symbol-cyclist" viewBox="-50 -90 100 180">
            <ellipse cx="0" cy="0" rx="34" ry="70" fill="#000000" opacity="0.3"/>
            <rect x="-6" y="-80" width="12" height="56" rx="4" fill="#1e293b"/>
            <line x1="0" y1="-80" x2="0" y2="-24" stroke="#64748b" stroke-width="2"/>
            <rect x="-6" y="24" width="12" height="56" rx="4" fill="#1e293b"/>
            <line x1="0" y1="24" x2="0" y2="80" stroke="#64748b" stroke-width="2"/>
            <path d="M0 -46 L0 36 M-30 -46 H30 M-30 -46 L-34 -34 M30 -46 L34 -34" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M-28 -34 L-16 -4 L16 -4 L28 -34" fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M-12 -12 L12 -12" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
            <circle cx="0" cy="-6" r="17" fill="#f59e0b"/>
            <path d="M-10 -16 Q0 -22 10 -16 Z" fill="#b45309"/>
          </symbol>

          <!-- 4. Realistic Top-Down Pedestrian -->
          <symbol id="symbol-pedestrian-walker" viewBox="-50 -60 100 120">
            <ellipse cx="2" cy="8" rx="32" ry="20" fill="#000000" opacity="0.35"/>
            <path d="M-28 6 L-16 -12 L16 -12 L28 6" fill="none" stroke="#e2e8f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <ellipse cx="0" cy="4" rx="16" ry="18" fill="#1d4ed8"/>
            <circle cx="0" cy="-14" r="17" fill="#475569"/>
            <circle cx="0" cy="-16" r="14" fill="#334155"/>
            <ellipse cx="-12" cy="32" rx="7" ry="13" fill="#0f172a"/>
            <ellipse cx="12" cy="-22" rx="7" ry="13" fill="#0f172a"/>
          </symbol>

          <!-- 5. OFFICIAL INDIAN ROAD SIGNS (IRC STANDARD) -->

          <!-- A: Mandatory Keep-Left Circular Sign -->
          <symbol id="sign-irc-keep-left" viewBox="-60 -60 120 120">
            <circle cx="0" cy="0" r="58" fill="#ffffff"/>
            <circle cx="0" cy="0" r="52" fill="#1d4ed8"/>
            <path d="M18 -26 L-14 6 L-8 12 L-32 16 L-24 -8 L-18 -2 L14 -30 Z" fill="#ffffff"/>
            <line x1="-20" y1="8" x2="-4" y2="-8" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
          </symbol>

          <!-- B: Cautionary Pedestrian Crossing Warning Sign -->
          <symbol id="sign-irc-pedestrian-warning" viewBox="-65 -60 130 120">
            <path d="M0 -52 L56 46 H-56 Z" fill="#dc2626" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
            <path d="M0 -40 L44 38 H-44 Z" fill="#ffffff" stroke-linejoin="round"/>
            <circle cx="0" cy="-18" r="6" fill="#0f172a"/>
            <path d="M0 -10 L0 10 L-8 30 M0 10 L8 30 M-10 0 L10 -4" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <line x1="-24" y1="32" x2="24" y2="32" stroke="#0f172a" stroke-width="4" stroke-dasharray="8 6"/>
          </symbol>

          <!-- C: Cautionary Cyclist Warning Sign -->
          <symbol id="sign-irc-cyclist-warning" viewBox="-65 -60 130 120">
            <path d="M0 -52 L56 46 H-56 Z" fill="#dc2626" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
            <path d="M0 -40 L44 38 H-44 Z" fill="#ffffff" stroke-linejoin="round"/>
            <circle cx="-16" cy="18" r="10" fill="none" stroke="#0f172a" stroke-width="3.5"/>
            <circle cx="16" cy="18" r="10" fill="none" stroke="#0f172a" stroke-width="3.5"/>
            <path d="M-16 18 L-4 2 L12 2 L16 18 M-4 2 L4 18 M-4 -6 H4" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </symbol>

          <!-- D: Regulatory Give Way Inverted Triangle (IRC Section 2) -->
          <symbol id="sign-irc-give-way" viewBox="-65 -60 130 120">
            <path d="M0 52 L-56 -46 H56 Z" fill="#dc2626" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
            <path d="M0 38 L-44 -36 H44 Z" fill="#ffffff" stroke-linejoin="round"/>
            <text x="0" y="-8" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="900" letter-spacing="1">GIVE</text>
            <text x="0" y="10" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="900" letter-spacing="1">WAY</text>
          </symbol>

          <!-- E: Regulatory Stop Octagon Sign (IRC Section 2) -->
          <symbol id="sign-irc-stop" viewBox="-60 -60 120 120">
            <polygon points="-24 -58 24 -58 58 -24 58 24 24 58 -24 58 -58 24 -58 -24" fill="#ffffff"/>
            <polygon points="-22 -54 22 -54 54 -22 54 22 22 54 -22 54 -54 22 -54 -22" fill="#dc2626"/>
            <text x="0" y="10" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="2">STOP</text>
          </symbol>

          <!-- F: Regulatory No-Overtaking Sign (IRC Section 2) -->
          <symbol id="sign-irc-no-overtaking" viewBox="-60 -60 120 120">
            <circle cx="0" cy="0" r="58" fill="#ffffff"/>
            <circle cx="0" cy="0" r="52" fill="#dc2626"/>
            <circle cx="0" cy="0" r="42" fill="#ffffff"/>
            <!-- Left Car (Black) & Right Car (Red Passing) -->
            <rect x="-24" y="-12" width="16" height="24" rx="4" fill="#0f172a"/>
            <rect x="8" y="-12" width="16" height="24" rx="4" fill="#dc2626"/>
            <!-- Red Slash -->
            <line x1="-34" y1="-34" x2="34" y2="34" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
          </symbol>

          <!-- G: Roundabout / Rotary Mandatory Sign (IRC Section 2) -->
          <symbol id="sign-irc-roundabout" viewBox="-60 -60 120 120">
            <circle cx="0" cy="0" r="58" fill="#ffffff"/>
            <circle cx="0" cy="0" r="52" fill="#1d4ed8"/>
            <!-- 3 Clockwise Rotary Arrows -->
            <path d="M0 -34 A34 34 0 0 1 30 16 L22 16 L34 30 L46 16 L38 16 A42 42 0 0 0 0 -42 Z" fill="#ffffff"/>
            <path d="M30 16 A34 34 0 0 1 -28 20 L-22 12 L-40 10 L-32 30 L-28 20 A42 42 0 0 0 38 20 Z" fill="#ffffff"/>
            <path d="M-28 20 A34 34 0 0 1 -2 -34 L-2 -26 L-16 -38 L-2 -50 L-2 -42 A42 42 0 0 0 -36 12 Z" fill="#ffffff"/>
          </symbol>

          <!-- 6. Directional Lane Arrow -->
          <symbol id="symbol-lane-arrow-up" viewBox="-30 -60 60 120">
            <path d="M0 -50 L26 -14 H11 V50 H-11 V-14 H-26 Z" fill="#ffffff" opacity="0.9"/>
          </symbol>

          <!-- 7. Safety Shield Emblem -->
          <symbol id="symbol-safety-shield" viewBox="-40 -45 80 90">
            <path d="M0 -40 C24 -40 36 -28 36 -10 C36 22 18 36 0 44 C-18 36 -36 22 -36 -10 C-36 -28 -24 -40 0 -40 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="3"/>
            <path d="M-12 -2 L-4 8 L16 -12" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </symbol>

  <!-- Master-Clock Deterministic Animation Engine -->
  <script>
    (() => {
      'use strict';

      // -------------------------------------------------------------
      // 1. CONSTANTS & TIMELINE SPECIFICATION (32.0s DURATION)
      // -------------------------------------------------------------
      const TOTAL_DURATION = 32.0; // Chunks 1 & 2 in seconds
      const SCENE_01A_START = 0.0;
      const SCENE_02A_START = 7.5;
      const SCENE_03A_START = 16.0;
      const SCENE_04A_START = 24.0;

      // DOM Element References
      const stageShell = document.getElementById('stage-shell');
      const scrubber = document.getElementById('scrubber-range');
      const timeCurrent = document.getElementById('time-current');
      const progressBar = document.getElementById('stage-progress-fill');
      const sceneStatusText = document.getElementById('active-scene-text');

      // Buttons & Icons
      const btnPlayPause = document.getElementById('btn-play-pause');
      const iconPlay = document.getElementById('icon-play');
      const iconPause = document.getElementById('icon-pause');
      const btnRestart = document.getElementById('btn-restart');
      const btnLoop = document.getElementById('btn-loop');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const iconFsEnter = document.getElementById('icon-fs-enter');
      const iconFsExit = document.getElementById('icon-fs-exit');

      const btnScene01a = document.getElementById('btn-scene-01a');
      const btnScene02a = document.getElementById('btn-scene-02a');
      const btnScene03a = document.getElementById('btn-scene-03a');
      const btnScene04a = document.getElementById('btn-scene-04a');

      // Road markings
      const roadZebraCrossing = document.getElementById('road-zebra-crossing');
      const roadCenterDashed = document.getElementById('road-center-dashed');
      const roadCenterSolid = document.getElementById('road-center-solid');
      const roadIntersectionMarkings = document.getElementById('road-intersection-markings');

      // Scene 01A Elements
      const scene01aGroup = document.getElementById('scene-01a');
      const heroOverlay01a = document.getElementById('hero-overlay-01a');
      const driverScanningGroup = document.getElementById('driver-scanning-group');
      const scanningArc = document.getElementById('scanning-arc');
      const actor01aEgo = document.getElementById('actor-01a-ego');
      const actor01aLead = document.getElementById('actor-01a-lead');
      const leadBrakeGlow = document.getElementById('lead-car-brake-glow');
      const actor01aCyclist = document.getElementById('actor-01a-cyclist');
      const actor01aPedestrian = document.getElementById('actor-01a-pedestrian');
      const focusLineCyclist = document.getElementById('focus-line-cyclist');
      const focusRingCyclist = document.getElementById('focus-ring-cyclist');
      const focusLineLead = document.getElementById('focus-line-lead');
      const focusRingLead = document.getElementById('focus-ring-lead');
      const focusLinePedestrian = document.getElementById('focus-line-pedestrian');
      const focusRingPedestrian = document.getElementById('focus-ring-pedestrian');
      const bracketCyclist = document.getElementById('dimension-bracket-cyclist');
      const bracketLead = document.getElementById('dimension-bracket-lead');
      const card01aScanning = document.getElementById('card-01a-scanning');
      const card01aBuffers = document.getElementById('card-01a-buffers');

      // Scene 02A Elements
      const scene02aGroup = document.getElementById('scene-02a');
      const banner02aHeader = document.getElementById('banner-02a-header');
      const actor02aEgo = document.getElementById('actor-02a-ego');
      const actor02aOncoming = document.getElementById('actor-02a-oncoming');
      const pill02aLeft = document.getElementById('pill-02a-left-lane');
      const pill02aRight = document.getElementById('pill-02a-right-lane');
      const card02aCoreRule = document.getElementById('card-02a-core-rule');
      const card02aOvertakeRule = document.getElementById('card-02a-overtake-rule');

      // Scene 03A Elements
      const scene03aGroup = document.getElementById('scene-03a');
      const banner03aHeader = document.getElementById('banner-03a-header');
      const actor03aTruck = document.getElementById('actor-03a-truck');
      const actor03aEgo = document.getElementById('actor-03a-ego');
      const egoBlinkerRight = document.getElementById('ego-blinker-right');
      const egoBlinkerLeft = document.getElementById('ego-blinker-left');
      const card03aSteps = document.getElementById('card-03a-steps');
      const card03aProhibited = document.getElementById('card-03a-prohibited');

      // Scene 04A Elements
      const scene04aGroup = document.getElementById('scene-04a');
      const banner04aHeader = document.getElementById('banner-04a-header');
      const actor04aEgo = document.getElementById('actor-04a-ego');
      const actor04aPriority = document.getElementById('actor-04a-priority');
      const guidePriorityRight = document.getElementById('guide-priority-right');
      const card04aRightOfWay = document.getElementById('card-04a-right-of-way');
      const card04aRoundabouts = document.getElementById('card-04a-roundabouts');
      const summaryOverlay04a = document.getElementById('summary-overlay-04a');

      // -------------------------------------------------------------
      // 2. MATHEMATICAL EASING & INTERPOLATION ENGINE
      // -------------------------------------------------------------
      const clamp = (val, min = 0, max = 1) => Math.max(min, Math.min(max, val));
      const mix = (a, b, t) => a + (b - a) * t;

      const easeInOutCubic = t => {
        const c = clamp(t);
        return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
      };

      const easeOutCubic = t => 1 - Math.pow(1 - clamp(t), 3);

      const fadeWindow = (t, start, enterEnd, exitStart, end) => {
        if (t < start || t > end) return 0;
        if (t < enterEnd) return easeOutCubic((t - start) / (enterEnd - start));
        if (t <= exitStart) return 1;
        return 1 - easeOutCubic((t - exitStart) / (end - exitStart));
      };

      const setOpacity = (elem, val) => {
        if (elem) elem.setAttribute('opacity', clamp(val).toFixed(3));
      };

      const setTransform = (elem, x, y, rot = 0, scale = 1) => {
        if (elem) elem.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${scale.toFixed(3)})`);
      };

      const formatTime = seconds => {
        const s = Math.max(0, Math.min(TOTAL_DURATION, Math.floor(seconds)));
        return `00:${String(s).padStart(2, '0')}`;
      };

      // -------------------------------------------------------------
      // 3. MASTER-CLOCK DETERMINISTIC RENDER FUNCTION (0.0s - 32.0s)
      // -------------------------------------------------------------
      function render(t) {
        const now = clamp(t, 0, TOTAL_DURATION);

        // Progress bar & scrubber UI sync
        progressBar.setAttribute('width', ((now / TOTAL_DURATION) * 1920).toFixed(1));
        if (!isUserDragging) {
          scrubber.value = now.toFixed(2);
        }
        timeCurrent.textContent = formatTime(now);

        // Active scene status chips
        const pills = [
          { btn: btnScene01a, active: now < SCENE_02A_START, text: '01A: Hazard Awareness Active' },
          { btn: btnScene02a, active: now >= SCENE_02A_START && now < SCENE_03A_START, text: '02A: Keep-Left Rule Active' },
          { btn: btnScene03a, active: now >= SCENE_03A_START && now < SCENE_04A_START, text: '03A: Safe Overtaking Active' },
          { btn: btnScene04a, active: now >= SCENE_04A_START, text: '04A: Right of Way Active' }
        ];

        pills.forEach(p => {
          if (p.active) {
            p.btn.classList.add('active');
            sceneStatusText.textContent = p.text;
          } else {
            p.btn.classList.remove('active');
          }
        });

        // Road markings context switching
        setOpacity(roadZebraCrossing, now < 8.0 ? 1 : 0);
        setOpacity(roadIntersectionMarkings, now >= 23.5 ? 1 : 0);
        setOpacity(roadCenterDashed, (now >= 16.0 && now <= 18.0) ? (18.0 - now) / 2.0 : (now > 18.0 && now < 23.5 ? 0 : 1));
        setOpacity(roadCenterSolid, (now >= 17.5 && now < 23.5) ? fadeWindow(now, 17.5, 18.5, 23.0, 23.5) : 0);

        // =========================================================
        // SCENE 01A: HAZARD SCANNING & AWARENESS (00:00 – 00:07.50)
        // =========================================================
        const scene01aOpacity = fadeWindow(now, 0, 0.2, 7.2, 7.6);
        setOpacity(scene01aGroup, scene01aOpacity);

        if (scene01aOpacity > 0) {
          const heroOpacity = now <= 1.4 ? 1 : 1 - easeOutCubic((now - 1.4) / 0.5);
          setOpacity(heroOverlay01a, heroOpacity);

          const egoProgress = easeInOutCubic((now - 1.5) / 5.5);
          const egoY = mix(890, 680, egoProgress);
          const egoX = 690;
          setTransform(actor01aEgo, egoX, egoY, 0, 1.18);

          const leadProgress = easeInOutCubic((now - 1.5) / 5.2);
          const leadY = mix(510, 430, leadProgress);
          setTransform(actor01aLead, 690, leadY, 0, 1.05);
          setOpacity(leadBrakeGlow, fadeWindow(now, 3.2, 3.8, 6.4, 7.0));

          const cyclistProgress = easeInOutCubic((now - 1.6) / 5.4);
          const cyclistY = mix(720, 500, cyclistProgress);
          setTransform(actor01aCyclist, 485, cyclistY, 0, 0.9);

          const pedProgress = easeInOutCubic((now - 2.5) / 4.4);
          const pedX = mix(1380, 1050, pedProgress);
          const pedY = 325;
          setTransform(actor01aPedestrian, pedX, pedY, 0, 0.95);

          const scanOpacity = fadeWindow(now, 1.8, 2.4, 6.8, 7.3);
          setOpacity(driverScanningGroup, scanOpacity);

          if (scanOpacity > 0) {
            const egoNoseY = egoY - 90;
            scanningArc.setAttribute('d', `M${egoX} ${egoNoseY} L${egoX - 320} ${egoNoseY - 500} L${egoX + 320} ${egoNoseY - 500} Z`);

            focusLineCyclist.setAttribute('x1', egoX);
            focusLineCyclist.setAttribute('y1', egoNoseY);
            focusLineCyclist.setAttribute('x2', 485);
            focusLineCyclist.setAttribute('y2', cyclistY);
            focusRingCyclist.setAttribute('cx', 485);
            focusRingCyclist.setAttribute('cy', cyclistY);

            focusLineLead.setAttribute('x1', egoX);
            focusLineLead.setAttribute('y1', egoNoseY);
            focusLineLead.setAttribute('x2', 690);
            focusLineLead.setAttribute('y2', leadY + 80);
            focusRingLead.setAttribute('cx', 690);
            focusRingLead.setAttribute('cy', leadY + 80);

            focusLinePedestrian.setAttribute('x1', egoX);
            focusLinePedestrian.setAttribute('y1', egoNoseY);
            focusLinePedestrian.setAttribute('x2', pedX);
            focusLinePedestrian.setAttribute('y2', pedY);
            focusRingPedestrian.setAttribute('cx', pedX);
            focusRingPedestrian.setAttribute('cy', pedY);
          }

          setOpacity(bracketCyclist, fadeWindow(now, 2.5, 3.0, 6.4, 6.9));
          bracketCyclist.setAttribute('transform', `translate(0, ${(cyclistY - 620).toFixed(1)})`);

          setOpacity(bracketLead, fadeWindow(now, 2.8, 3.3, 6.4, 6.9));
          bracketLead.setAttribute('transform', `translate(0, ${(leadY - 480).toFixed(1)})`);

          setOpacity(card01aScanning, fadeWindow(now, 2.2, 2.7, 4.5, 4.9));
          setOpacity(card01aBuffers, fadeWindow(now, 4.9, 5.4, 6.8, 7.3));
        }

        // =========================================================
        // SCENE 02A: KEEP TO THE LEFT (00:07.50 – 00:16.00)
        // =========================================================
        const scene02aOpacity = fadeWindow(now, 7.3, 7.8, 15.6, 16.0);
        setOpacity(scene02aGroup, scene02aOpacity);

        if (scene02aOpacity > 0) {
          setOpacity(banner02aHeader, fadeWindow(now, 7.8, 8.3, 14.8, 15.4));

          const keepMotion = easeInOutCubic((now - 8.0) / 6.6);
          const keepEgoY = mix(920, 420, keepMotion);
          setTransform(actor02aEgo, 690, keepEgoY, 0, 1.18);

          const oncomingY = mix(120, 720, keepMotion);
          setTransform(actor02aOncoming, 1230, oncomingY, 180, 1.18);

          setOpacity(pill02aLeft, fadeWindow(now, 8.4, 8.9, 14.6, 15.2));
          setOpacity(pill02aRight, fadeWindow(now, 8.8, 9.3, 14.6, 15.2));

          setOpacity(card02aCoreRule, fadeWindow(now, 8.2, 8.7, 11.6, 12.1));
          setOpacity(card02aOvertakeRule, fadeWindow(now, 12.2, 12.7, 15.2, 15.6));
        }

        // =========================================================
        // SCENE 03A: SAFE OVERTAKING DISCIPLINE (00:16.00 – 00:24.00)
        // =========================================================
        const scene03aOpacity = fadeWindow(now, 15.8, 16.3, 23.6, 24.0);
        setOpacity(scene03aGroup, scene03aOpacity);

        if (scene03aOpacity > 0) {
          setOpacity(banner03aHeader, fadeWindow(now, 16.2, 16.7, 23.2, 23.7));

          // Truck moves steadily forward in left lane: y=520 -> y=440
          const truckY = mix(560, 420, easeInOutCubic((now - 16.0) / 7.5));
          setTransform(actor03aTruck, 690, truckY, 0, 1.15);

          // Ego Car MSM (Mirror-Signal-Manoeuvre) Multi-Stage Trajectory:
          // Phase 1 (16.0 - 18.0s): Follow behind truck (x=690, y=920 -> 820)
          // Phase 2 (18.0 - 20.2s): Signal Right & Pull out into right lane (x: 690 -> 1180, y: 820 -> 560)
          // Phase 3 (20.2 - 21.8s): Accelerate past truck on the right (x: 1180, y: 560 -> 340)
          // Phase 4 (21.8 - 23.8s): Signal Left & Return safely to left lane (x: 1180 -> 690, y: 340 -> 160)
          let ego3X = 690;
          let ego3Y = 920;
          let ego3Rot = 0;
          let blinkRight = 0;
          let blinkLeft = 0;

          if (now < 18.0) {
            ego3Y = mix(920, 820, easeInOutCubic((now - 16.0) / 2.0));
          } else if (now < 20.2) {
            const p = easeInOutCubic((now - 18.0) / 2.2);
            ego3X = mix(690, 1180, p);
            ego3Y = mix(820, 560, p);
            ego3Rot = Math.sin(p * Math.PI) * 12; // Slight right yaw then straighten
            // Flashing Right Blinker
            blinkRight = (Math.sin(now * 16) > 0) ? 1 : 0;
          } else if (now < 21.8) {
            const p = easeInOutCubic((now - 20.2) / 1.6);
            ego3X = 1180;
            ego3Y = mix(560, 340, p);
            ego3Rot = 0;
          } else {
            const p = easeInOutCubic((now - 21.8) / 2.0);
            ego3X = mix(1180, 690, p);
            ego3Y = mix(340, 160, p);
            ego3Rot = -Math.sin(p * Math.PI) * 12; // Slight left yaw then straighten
            // Flashing Left Blinker
            blinkLeft = (Math.sin(now * 16) > 0) ? 1 : 0;
          }

          setTransform(actor03aEgo, ego3X, ego3Y, ego3Rot, 1.18);
          setOpacity(egoBlinkerRight, blinkRight);
          setOpacity(egoBlinkerLeft, blinkLeft);

          // Educational Cards
          setOpacity(card03aSteps, fadeWindow(now, 16.5, 17.0, 20.0, 20.5));
          setOpacity(card03aProhibited, fadeWindow(now, 20.6, 21.1, 23.5, 23.9));
        }

        // =========================================================
        // SCENE 04A: INTERSECTIONS & RIGHT OF WAY (00:24.00 – 00:32.00)
        // =========================================================
        const scene04aOpacity = fadeWindow(now, 23.8, 24.3, 32.0, 32.0);
        setOpacity(scene04aGroup, scene04aOpacity);

        if (scene04aOpacity > 0) {
          setOpacity(banner04aHeader, fadeWindow(now, 24.2, 24.7, 30.5, 31.0));

          // Blue Ego Car drives up and decelerates to a stop at the Give-Way Line (y: 880 -> 610)
          let ego4Y = 880;
          if (now < 27.5) {
            ego4Y = mix(880, 610, easeInOutCubic((now - 24.0) / 3.5));
          } else if (now >= 29.5) {
            // Once right vehicle passes, Ego moves smoothly into junction
            ego4Y = mix(610, 360, easeInOutCubic((now - 29.5) / 2.3));
          } else {
            ego4Y = 610; // Holds at stop line
          }
          setTransform(actor04aEgo, 690, ego4Y, 0, 1.18);

          // Priority Amber Car travels from right to left across junction: x=1480 -> x=420 between 26.0s and 29.5s
          const priorityProgress = easeInOutCubic((now - 25.8) / 3.8);
          const priorityX = mix(1520, 380, priorityProgress);
          setTransform(actor04aPriority, priorityX, 420, -90, 1.18);

          // Yielding indicator beam (26.0s -> 29.2s)
          setOpacity(guidePriorityRight, fadeWindow(now, 25.8, 26.4, 29.0, 29.6));

          // Educational Cards
          setOpacity(card04aRightOfWay, fadeWindow(now, 24.5, 25.0, 27.8, 28.3));
          setOpacity(card04aRoundabouts, fadeWindow(now, 28.4, 28.9, 30.8, 31.2));

          // Final Comprehensive Outro (30.8s -> 32.0s)
          setOpacity(summaryOverlay04a, fadeWindow(now, 30.8, 31.3, 32.0, 32.0));
        }
      }

      // -------------------------------------------------------------
      // 4. PLAYBACK CONTROLLER & ANIMATION LOOP
      // -------------------------------------------------------------
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let isPlaying = !prefersReducedMotion;
      let isLooping = true;
      let currentTime = 0;
      let lastTimestamp = performance.now();
      let isUserDragging = false;

      function updatePlayButtonUI() {
        if (isPlaying) {
          iconPlay.style.display = 'none';
          iconPause.style.display = 'block';
          btnPlayPause.setAttribute('aria-label', 'Pause animation');
        } else {
          iconPlay.style.display = 'block';
          iconPause.style.display = 'none';
          btnPlayPause.setAttribute('aria-label', 'Play animation');
        }
      }

      function togglePlayPause() {
        isPlaying = !isPlaying;
        lastTimestamp = performance.now();
        updatePlayButtonUI();
      }

      function restartPlayback() {
        currentTime = 0;
        isPlaying = true;
        lastTimestamp = performance.now();
        render(0);
        updatePlayButtonUI();
      }

      function seekTo(timeInSeconds) {
        currentTime = clamp(timeInSeconds, 0, TOTAL_DURATION);
        render(currentTime);
      }

      // Main requestAnimationFrame Tick
      function animationTick(nowTimestamp) {
        const delta = Math.min((nowTimestamp - lastTimestamp) / 1000, 0.1);
        lastTimestamp = nowTimestamp;

        if (isPlaying && !isUserDragging) {
          currentTime += delta;
          if (currentTime >= TOTAL_DURATION) {
            if (isLooping) {
              currentTime = currentTime % TOTAL_DURATION;
            } else {
              currentTime = TOTAL_DURATION;
              isPlaying = false;
              updatePlayButtonUI();
            }
          }
        }

        render(currentTime);
        requestAnimationFrame(animationTick);
      }

      // -------------------------------------------------------------
      // 5. EVENT LISTENERS & INTERACTION HANDLERS
      // -------------------------------------------------------------
      btnPlayPause.addEventListener('click', togglePlayPause);
      btnRestart.addEventListener('click', restartPlayback);

      btnLoop.addEventListener('click', () => {
        isLooping = !isLooping;
        btnLoop.setAttribute('aria-pressed', String(isLooping));
      });

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) {
            if (stageShell.requestFullscreen) {
              await stageShell.requestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              await document.exitFullscreen();
            }
          }
        } catch (err) {
          console.warn('Fullscreen request error:', err);
        }
      }

      btnFullscreen.addEventListener('click', toggleFullscreen);

      document.addEventListener('fullscreenchange', () => {
        const isFs = Boolean(document.fullscreenElement);
        iconFsEnter.style.display = isFs ? 'none' : 'block';
        iconFsExit.style.display = isFs ? 'block' : 'none';
        btnFullscreen.setAttribute('aria-label', isFs ? 'Exit fullscreen' : 'Enter fullscreen');
      });

      // Scrubber Events
      scrubber.addEventListener('pointerdown', () => {
        isUserDragging = true;
      });

      scrubber.addEventListener('input', e => {
        seekTo(parseFloat(e.target.value));
      });

      scrubber.addEventListener('change', e => {
        isUserDragging = false;
        seekTo(parseFloat(e.target.value));
        lastTimestamp = performance.now();
      });

      window.addEventListener('pointerup', () => {
        if (isUserDragging) {
          isUserDragging = false;
          lastTimestamp = performance.now();
        }
      });

      // Scene Quick Jump Buttons
      btnScene01a.addEventListener('click', () => seekTo(SCENE_01A_START));
      btnScene02a.addEventListener('click', () => seekTo(SCENE_02A_START));
      btnScene03a.addEventListener('click', () => seekTo(SCENE_03A_START));
      btnScene04a.addEventListener('click', () => seekTo(SCENE_04A_START));

      document.querySelectorAll('.scene-jump-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetTime = parseFloat(btn.getAttribute('data-time'));
          if (!isNaN(targetTime)) seekTo(targetTime);
        });
      });

      // Keyboard Shortcuts
      document.addEventListener('keydown', e => {
        if (e.target instanceof HTMLInputElement) return;

        switch (e.code) {
          case 'Space':
            e.preventDefault();
            togglePlayPause();
            break;
          case 'KeyR':
            e.preventDefault();
            restartPlayback();
            break;
          case 'KeyL':
            e.preventDefault();
            btnLoop.click();
            break;
          case 'KeyF':
            e.preventDefault();
            toggleFullscreen();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            seekTo(currentTime - 1.0);
            break;
          case 'ArrowRight':
            e.preventDefault();
            seekTo(currentTime + 1.0);
            break;
        }
      });

      // Initial Render & Start Loop
      render(0);
      updatePlayButtonUI();
      requestAnimationFrame(animationTick);
    })();
  </script>
</body>
</html>
